<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ZEVRON</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #1d1d1f;
      --mut: #6e6e73;
      --gl: rgba(255, 255, 255, .55);
      --gb: rgba(255, 255, 255, .7);
      --sh: 0 8px 32px rgba(0, 0, 0, .08);
      --ac: #000;
      --ac-t: #fff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    :root[data-theme="dark"] {
      --bg: #000;
      --fg: #f5f5f7;
      --mut: #a1a1a6;
      --gl: rgba(40, 40, 44, .55);
      --gb: rgba(255, 255, 255, .14);
      --sh: 0 8px 32px rgba(0, 0, 0, .5);
      --ac: #fff;
      --ac-t: #000
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 -apple-system, "SF Pro Display", Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      transition: background .5s, color .5s;
      overflow-x: hidden
    }

    .glass {
      background: var(--gl);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--gb);
      box-shadow: var(--sh), inset 0 1px 0 rgba(255, 255, 255, .25)
    }

    nav {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: min(960px, 94%);
      z-index: 50;
      border-radius: 999px;
      padding: 8px 10px 8px 22px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    nav b {
      letter-spacing: .35em;
      font-size: 15px;
      flex: 1
    }

    .btn {
      border: 0;
      background: var(--ac);
      color: var(--ac-t);
      padding: 10px 20px;
      border-radius: 999px;
      font: 600 14px inherit;
      font-family: inherit;
      cursor: pointer;
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .3s
    }

    .btn:hover {
      opacity: .85
    }

    .ib {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--gb);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      font-size: 15px;
      transition: .3s
    }

    .ib:hover {
      background: var(--gl)
    }

    select.ib {
      width: auto;
      padding: 0 8px;
      font-size: 13px;
      appearance: none;
      text-align: center
    }

    .hero {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 120px 20px 60px;
      position: relative;
      overflow: hidden
    }

    .orb {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--fg), transparent 65%);
      opacity: .08;
      filter: blur(40px);
      animation: fl 12s ease-in-out infinite
    }

    @keyframes fl {
      50% {
        transform: translate(60px, -40px) scale(1.15)
      }
    }

    h1 {
      font-size: clamp(44px, 9vw, 104px);
      line-height: 1.02;
      letter-spacing: -.04em;
      font-weight: 700
    }

    .sub {
      color: var(--mut);
      font-size: clamp(17px, 2.4vw, 26px);
      margin: 18px auto 30px;
      max-width: 640px
    }

    .rv {
      opacity: 0;
      transform: translateY(40px) scale(.98);
      transition: opacity .9s cubic-bezier(.2, .8, .2, 1), transform .9s cubic-bezier(.2, .8, .2, 1)
    }

    .rv.in {
      opacity: 1;
      transform: none
    }

    section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 20px
    }

    h2 {
      font-size: clamp(30px, 5vw, 52px);
      letter-spacing: -.03em;
      margin-bottom: 28px
    }

    .chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px
    }

    .chip {
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      color: var(--fg);
      transition: .3s
    }

    .chip.on {
      background: var(--ac);
      color: var(--ac-t)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px
    }

    .card {
      border-radius: 28px;
      overflow: hidden;
      transition: transform .5s cubic-bezier(.2, .8, .2, 1);
      animation: pop .8s cubic-bezier(.2, .8, .2, 1) both
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.9)
      }
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02)
    }

    .card .im {
      aspect-ratio: 1;
      background: var(--bg) center/cover;
      overflow: hidden
    }

    .card .im img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .8s
    }

    .card:hover img {
      transform: scale(1.08)
    }

    .card .tx {
      padding: 18px
    }

    .card p {
      color: var(--mut);
      font-size: 14px;
      margin: 4px 0 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      border-radius: 28px;
      color: var(--mut)
    }

    .feat {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px
    }

    .feat div {
      padding: 28px;
      border-radius: 28px
    }

    .feat span {
      font-size: 30px
    }

    .panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(420px, 100%);
      z-index: 90;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 22px 24px;
      transform: translateX(105%);
      transition: transform .6s cubic-bezier(.2, .8, .2, 1);
      overflow: auto;
      border-radius: 28px 0 0 28px
    }

    .panel.open {
      transform: none
    }

    .panel.pw {
      width: min(560px, 100%)
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 14px;
      margin: 6px 0;
      border-radius: 14px;
      border: 1px solid var(--gb);
      background: var(--gl);
      color: var(--fg);
      font: inherit
    }

    .ci {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--gb);
      font-size: 14px
    }

    .ci img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover
    }

    .thumbs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .thumbs img {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover
    }

    #toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translate(-50%, 120px);
      padding: 12px 22px;
      border-radius: 999px;
      z-index: 99;
      transition: transform .6s cubic-bezier(.2, .8, .2, 1)
    }

    #toast.s {
      transform: translate(-50%, 0)
    }

    body>.hero,
    body>section,
    body>footer {
      will-change: filter, transform
    }

    .ct a {
      color: var(--fg);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid var(--gb)
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: .8s
    }

    #pg {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: var(--fg);
      transform-origin: 0 50%;
      transform: scaleX(0);
      z-index: 99
    }

    nav {
      transition: padding .5s, width .6s cubic-bezier(.2, .8, .2, 1), top .5s
    }

    nav.sm {
      width: min(760px, 90%);
      padding-top: 5px;
      padding-bottom: 5px;
      top: calc(4px + env(safe-area-inset-top, 0px))
    }

    .w {
      display: inline-block;
      opacity: 0;
      filter: blur(16px);
      transform: translateY(34px) scale(.96);
      animation: wi 1.1s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(var(--i)*.13s + .2s)
    }

    @keyframes wi {
      to {
        opacity: 1;
        filter: none;
        transform: none
      }
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(24px);
        filter: blur(8px)
      }
    }

    .hero .sub {
      animation: up 1.1s .9s cubic-bezier(.2, .8, .2, 1) both
    }

    .orb {
      translate: var(--px, 0) var(--py, 0);
      transition: translate .9s cubic-bezier(.2, .8, .2, 1)
    }

    .orb.b {
      width: 340px;
      height: 340px;
      left: 12%;
      top: 58%;
      animation-duration: 9s;
      animation-direction: reverse;
      opacity: .06
    }

    .card {
      position: relative;
      transform: perspective(900px) rotateX(var(--ry, 0deg)) rotateY(var(--rx, 0deg));
      transition: transform .15s ease-out, translate .5s cubic-bezier(.2, .8, .2, 1), scale .5s cubic-bezier(.2, .8, .2, 1)
    }

    .card:hover {
      transform: perspective(900px) rotateX(var(--ry, 0deg)) rotateY(var(--rx, 0deg));
      translate: 0 -8px;
      scale: 1.03
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .4s;
      background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), rgba(128, 128, 128, .28), transparent 70%)
    }

    .card:hover::after {
      opacity: 1
    }

    .feat span {
      display: inline-block;
      animation: bob 3.2s ease-in-out infinite
    }

    .feat div:nth-child(2) span {
      animation-delay: .5s
    }

    .feat div:nth-child(3) span {
      animation-delay: 1s
    }

    @keyframes bob {
      50% {
        transform: translateY(-9px) rotate(6deg)
      }
    }

    .feat div {
      transition: transform .5s cubic-bezier(.2, .8, .2, 1)
    }

    .feat div:hover {
      transform: translateY(-8px) scale(1.03)
    }

    .panel.open .ci {
      animation: up .6s cubic-bezier(.2, .8, .2, 1) both
    }

    .chip {
      transition: .35s cubic-bezier(.2, .8, .2, 1)
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      ::before,
      ::after {
        animation-duration: .01ms !important;
        animation-delay: 0s !important;
        transition-duration: .01ms !important
      }
    }

    footer {
      text-align: center;
      color: var(--mut);
      padding: 40px 20px 60px;
      font-size: 13px
    }
  </style>
</head>

<body>
  <div id="pg"></div>
  <nav class="glass" id="nv"><b id="lo" style="user-select:none;-webkit-user-select:none;cursor:default">ZEVRON</b>
    <select class="ib" id="lg">
      <option>ru</option>
      <option>uz</option>
      <option>en</option>
    </select>
    <button class="ib" id="th">◐</button>
    <button class="ib" id="ct">🛍 <small id="cn">0</small></button>
  </nav>

  <div class="hero">
    <div class="orb"></div>
    <div class="orb b"></div>
    <div class="rv">
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
      <button class="btn" onclick="goShop()" data-t="shop"></button>
    </div>
  </div>

  <section id="shop">
    <h2 class="rv" data-t="cat"></h2>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section>
    <div class="feat">
      <div class="glass rv"><span>⚡</span>
        <h3 data-t="f1"></h3>
        <p class="sub" style="font-size:15px;margin:6px 0 0" data-t="f1d"></p>
      </div>
      <div class="glass rv"><span>✈️</span>
        <h3 data-t="f2"></h3>
        <p class="sub" style="font-size:15px;margin:6px 0 0" data-t="f2d"></p>
      </div>
      <div class="glass rv"><span>✓</span>
        <h3 data-t="f3"></h3>
        <p class="sub" style="font-size:15px;margin:6px 0 0" data-t="f3d"></p>
      </div>
    </div>
  </section>
  <footer class="ct">© ZEVRON · <a href="https://t.me/NoAboutme" target="_blank">Telegram @NoAboutme</a> · <a
      href="tel:+998910155288">+998 (91) 015 52 88</a></footer>

  <aside class="panel glass" id="cart">
    <div class="row">
      <h2 style="margin:0;font-size:28px" data-t="cart"></h2><button class="ib" onclick="op('cart',0)">✕</button>
    </div>
    <div id="cl"></div>
    <div class="row" style="margin:16px 0"><b data-t="total"></b><b id="tt"></b></div>
    <p class="sub" style="font-size:14px;margin:0 0 14px" data-t="f2d"></p>
    <button class="btn" style="width:100%" id="pay" data-t="pay"></button>
    <p class="ct sub" style="font-size:14px;margin:14px 0 0;text-align:center"><a href="https://t.me/NoAboutme"
        target="_blank">@NoAboutme</a> · <a href="tel:+998910155288">+998 (91) 015 52 88</a></p>
  </aside>

  <div id="toast" class="glass"></div>

  <script>
    const L = {
      ru: { h1: "Звук. Контроль. Точность.", sub: "Наушники, мыши и клавиатуры нового уровня.", shop: "Смотреть", cat: "Каталог", all: "Все", headphones: "Наушники", mice: "Мыши", keyboards: "Клавиатуры", f1: "Мгновенно", f1d: "Новинки появляются в магазине в реальном времени.", f2: "Доставка по Ташкенту за 1 день", f2d: "Доставка только по Ташкенту, в течение 1 дня.", f3: "Оплата в Telegram", f3d: "Быстро и просто через @NoAboutme.", add: "В корзину", cart: "Корзина", total: "Итого", pay: "Оплатить в Telegram", none: "Пока ничего нет. Скоро здесь появятся товары.", empty: "Корзина пуста", admin: "Админ", new: "Новый товар в магазине!", cur: "сум" },
      uz: { h1: "Ovoz. Nazorat. Aniqlik.", sub: "Yangi darajadagi quloqchin, sichqoncha va klaviaturalar.", shop: "Ko'rish", cat: "Katalog", all: "Hammasi", headphones: "Quloqchinlar", mice: "Sichqonchalar", keyboards: "Klaviaturalar", f1: "Bir zumda", f1d: "Yangi mahsulotlar real vaqtda paydo bo'ladi.", f2: "Toshkent bo'ylab 1 kunda yetkazish", f2d: "Faqat Toshkent bo'ylab, 1 kun ichida yetkazamiz.", f3: "Telegram orqali to'lov", f3d: "Tez va oson — @NoAboutme.", add: "Savatga", cart: "Savat", total: "Jami", pay: "Telegramda to'lash", none: "Hozircha hech narsa yo'q. Tez orada mahsulotlar qo'shiladi.", empty: "Savat bo'sh", admin: "Admin", new: "Do'konda yangi mahsulot!", cur: "so'm" },
      en: { h1: "Sound. Control. Precision.", sub: "Next-level headphones, mice and keyboards.", shop: "Shop now", cat: "Catalog", all: "All", headphones: "Headphones", mice: "Mice", keyboards: "Keyboards", f1: "Instant", f1d: "New products appear in the store in real time.", f2: "1-day delivery in Tashkent", f2d: "Delivery in Tashkent only, within 1 day.", f3: "Pay via Telegram", f3d: "Fast and simple through @NoAboutme.", add: "Add to cart", cart: "Cart", total: "Total", pay: "Pay on Telegram", none: "Nothing here yet. Products are coming soon.", empty: "Cart is empty", admin: "Admin", new: "New product in store!", cur: "UZS" }
    };
    const $ = i => document.getElementById(i); let canAdm = false, lang = "ru", items = [], cart = {}, cat = "all", db = null, seen = false, imgs = [];
    try { lang = localStorage.zl || lang; const t = localStorage.zt; if (t) document.documentElement.dataset.theme = t } catch (e) { }
    const t = k => L[lang][k] || k, fmt = n => Number(n).toLocaleString("ru") + " " + t("cur");
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    function toast(m) { const e = $("toast"); e.textContent = m; e.classList.add("s"); setTimeout(() => e.classList.remove("s"), 2800) }
    function op(id, o) { $(id).classList.toggle("open", !!o) }
    function tr() { document.documentElement.lang = lang; document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t)); $("lg").value = lang; draw(); hw() }
    function draw() {
      $("chips").innerHTML = ["all", "headphones", "mice", "keyboards"].map(c => `<button class="chip glass ${c == cat ? "on" : ""}" data-c="${c}">${t(c)}</button>`).join("");
      const f = items.filter(p => cat == "all" || p.cat == cat);
      $("grid").innerHTML = f.length ? f.map((p, i) => `<div class="card glass" style="${shown.has(p.id) ? "animation:none" : "animation-delay:" + i * 80 + "ms"}"><div class="im">${p.imgs && p.imgs[0] ? `<img src="${p.imgs[0]}" alt="">` : ""}</div><div class="tx"><h3>${esc(p.name)}</h3><p>${esc(p.desc || "")}</p><div class="row"><b>${fmt(p.price)}</b><button class="btn" data-a="${p.id}">${t("add")}</button></div></div></div>`).join("") : `<div class="empty glass" style="grid-column:1/-1">${t("none")}</div>`;
      const ks = Object.keys(cart).filter(k => items.find(p => p.id == k)); let s = 0, n = 0;
      $("cl").innerHTML = ks.length ? ks.map(k => { const p = items.find(x => x.id == k), q = cart[k]; s += p.price * q; n += q; return `<div class="ci"><img src="${p.imgs && p.imgs[0] || ""}" alt=""><div style="flex:1">${esc(p.name)}<br><small>${fmt(p.price)} × ${q}</small></div><button class="ib" data-m="${k}">−</button></div>` }).join("") : `<p class="sub" style="font-size:15px">${t("empty")}</p>`;
      $("tt").textContent = fmt(s); $("cn").textContent = n; f.forEach(p => shown.add(p.id));
      const al = $("al"); if (al) al.innerHTML = items.map(p => `<div class="ci"><img src="${p.imgs && p.imgs[0] || ""}" alt=""><div style="flex:1">${esc(p.name)}</div><button class="ib" data-d="${p.id}">🗑</button></div>`).join("")
    }
    document.addEventListener("click", e => {
      const b = e.target.closest("[data-c],[data-a],[data-m],[data-d]"); if (!b) return; const d = b.dataset;
      if (d.c) { cat = d.c; draw() } if (d.a) { cart[d.a] = (cart[d.a] || 0) + 1; draw(); toast("✓ " + t("add")) }
      if (d.m) { if (--cart[d.m] <= 0) delete cart[d.m]; draw() }
      if (d.d && db) db.collection("products").doc(d.d).delete()
    });
    $("th").onclick = () => { const r = document.documentElement, dk = getComputedStyle(r).getPropertyValue("--bg").trim() == "#000", n = dk ? "light" : "dark", ap = () => { r.dataset.theme = n; try { localStorage.zt = n } catch (e) { } }; document.startViewTransition ? document.startViewTransition(ap) : ap() };
    $("lg").onchange = e => { lang = e.target.value; try { localStorage.zl = lang } catch (e) { } tr() };
    $("ct").onclick = () => op("cart", 1);
    $("pay").onclick = () => {
      const ks = Object.keys(cart).filter(k => items.find(p => p.id == k)); if (!ks.length) return; let s = 0;
      const ln = ks.map(k => { const p = items.find(x => x.id == k); s += p.price * cart[k]; return `• ${p.name} × ${cart[k]} — ${fmt(p.price * cart[k])}` });
      const m = `ZEVRON\n${ln.join("\n")}\n${t("total")}: ${fmt(s)}\n🚚 Tashkent, 1 day\n📞 +998 (91) 015 52 88`;
      window.open("https://t.me/NoAboutme?text=" + encodeURIComponent(m), "_blank")
    };
    function shrink(f) { return new Promise(r => { const i = new Image(); i.onload = () => { const k = Math.min(1, 700 / Math.max(i.width, i.height)), c = document.createElement("canvas"); c.width = i.width * k; c.height = i.height * k; c.getContext("2d").drawImage(i, 0, 0, c.width, c.height); r(c.toDataURL("image/jpeg", .72)) }; i.src = URL.createObjectURL(f) }) }
    function wireAdm() {
      $("af").onchange = async e => { imgs = []; for (const f of [...e.target.files].slice(0, 3)) imgs.push(await shrink(f)); $("th2").innerHTML = imgs.map(s => `<img src="${s}">`).join("") };
      $("pub").onclick = async () => {
        const n = $("an").value.trim(), p = +$("ap2").value; if (!n || !p || !db) return toast("Name + price");
        try {
          await db.collection("products").add({ name: n, price: p, cat: $("ac").value.trim().toLowerCase() || "headphones", desc: $("ad").value, imgs, ts: Date.now() });
          ["an", "ap2", "ac", "ad"].forEach(i => $(i).value = ""); $("af").value = ""; imgs = []; $("th2").innerHTML = ""; toast("✓")
        } catch (e) { toast("Error: " + (e.message || e.code)) }
      };
      function goShop() {
        const el = $("shop"), y0 = scrollY, y1 = Math.max(0, el.getBoundingClientRect().top + y0 - 70), dist = y1 - y0;
        if (matchMedia("(prefers-reduced-motion:reduce)").matches) { scrollTo(0, y1); return }
